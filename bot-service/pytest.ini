[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: tests de integración
    unit: tests unitarios
    slow: tests lentos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning